org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
kotlin.code.style=official
# bravia-custom: no in-app updates. Empty = Home settings, Updates never checks GitHub, downloads or
# installs anything (Updater.kt). -PupdateRepo=owner/name on the command line overrides this.
updateRepo=
# bravia-custom: release builds must be signed with the fork's permanent key (build.gradle.kts,
# checkReleaseKey). The certificate fingerprint below is public; the key and passwords never enter the repo.
requireReleaseKey=true
releaseCertSha256=2C:C1:7E:33:77:79:9A:68:A4:37:90:67:22:9C:F2:46:BB:8B:FB:68:08:79:7D:D2:9B:D2:DC:95:A1:DC:52:AF
